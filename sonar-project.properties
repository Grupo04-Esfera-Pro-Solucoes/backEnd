# Identificador único para o projeto no SonarQube
sonar.projectKey=Esfera

# Nome do projeto (opcional)
sonar.projectName=Esfera
# Versão do projeto (opcional)
sonar.projectVersion=1.0

# URL do servidor SonarQube
sonar.host.url=http://localhost:9000

# Token de autenticação do SonarQube (substitua pelo seu token)
sonar.login=sqa_51df46cb37453e8965e993670578023a842fed9c

# Diretório que contém o código-fonte (use '.' para a raiz do projeto)
sonar.sources=.

# Linguagem principal do projeto (opcional, SonarQube geralmente detecta automaticamente)
sonar.language=java

# Excluir arquivos ou diretórios específicos (opcional)
sonar.exclusions=**/tests/**,**/*.xml

# Configurações adicionais para análise em Java (remova se não for Java)
sonar.java.binaries=target/classes

# Excluir arquivos de teste da cobertura de código (opcional)
sonar.test.exclusions=**/*Test.java
